<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文章 · 我的博客</title>
  <link rel="stylesheet" href="libs/bulma.min.css" />
  <link rel="stylesheet" href="libs/fontawesome/css/all.min.css" />
  <!-- 给代码高亮样式表加上 ID 以便 JS 动态切换 -->
  <link id="hljs-theme" rel="stylesheet" href="libs/github.min.css" />
  <link rel="stylesheet" href="custom.css" />
  <link rel="stylesheet" href="custom-themes.css" />
  <!-- Anti-FOUC: 防止页面刷新时主题闪烁 -->
  <script>
    (function() {
      var mode = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var palette = localStorage.getItem('palette') || 'default';
      if (palette !== 'default') document.documentElement.setAttribute('data-palette', palette);
    })();
  </script>
</head>
<body>
  <div id="site-navbar"></div>

  <section class="section" style="padding-top:5rem;">
    <div class="container">
      <div class="columns">
        <div class="column is-9">
          <div id="post-header"></div>
          <div id="post-body" class="content post-content"></div>
          <div id="post-footer-extras"></div><div id="post-nav" class="mt-6"></div>
          <div id="post-status"></div>
        </div>
        
        <div class="column is-3 is-hidden-touch">
          <div class="toc-sticky">
            <p class="menu-label">目录</p>
            <ul class="menu-list" id="toc-list"></ul>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="libs/marked.min.js"></script>
  <script src="libs/highlight.min.js"></script>
  
  <script src="js/fallback-data.js"></script>
  <script src="js/common.js" defer></script>
  <script src="js/post.js" defer></script>
  <script src="js/effects.js" defer></script>
  <script src="js/theme.js" defer></script>
</body>
</html>
